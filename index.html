<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISKL Campus Sensors</title>
<style>
:root{
  /* ---- adjust when placing on signage ---- */
  --cols:3;         /* how many icons per row */
  --gap:2.4vmin;    /* space between icons */
  --pad:3vmin;      /* outer padding; 0 to bleed to edges */
  --radius:23%;     /* icon corner roundness (iOS squircle ~ 22-24%) */
  --textscale:1;    /* nudge text bigger/smaller inside icons */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:var(--pad);overflow:hidden}

.venues{height:100%;width:100%;display:flex;flex-wrap:wrap;gap:var(--gap);
  align-content:center;justify-content:center}

.card{
  width:min(calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)), 92vh);
  aspect-ratio:1;border-radius:var(--radius);position:relative;overflow:hidden;
  container-type:size;color:#fff;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 2.4vmin 6vmin -2vmin rgba(0,0,0,.5), inset 0 .35vmin 0 rgba(255,255,255,.35);
}
.card::after{content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
  background:radial-gradient(125% 80% at 50% -12%,rgba(255,255,255,.38),transparent 55%)}
.card .name{font-size:calc(11cqmin * var(--textscale));font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;opacity:.96;padding:0 6%;line-height:1.1}
.card .face{width:calc(24cqmin * var(--textscale));height:calc(24cqmin * var(--textscale));margin:calc(1.5cqmin * var(--textscale)) 0 calc(-1cqmin * var(--textscale));filter:drop-shadow(0 .4vmin 1vmin rgba(0,0,0,.25))}
.card .val{font-size:calc(40cqmin * var(--textscale));font-weight:800;line-height:.92;letter-spacing:-.03em;
  text-shadow:0 .5vmin 1.5vmin rgba(0,0,0,.18)}
.card .cat{font-size:calc(8.5cqmin * var(--textscale));font-weight:700;opacity:.95;
  margin-top:calc(1.5cqmin * var(--textscale));padding:0 6%;line-height:1.1}

.err{position:fixed;top:1vh;left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(0,0,0,.4);color:#ffd9d3;padding:.7vh 1.4vw;border-radius:1vh;font-size:1.7vh}
</style>
</head>

<div id="errBox"></div>
<div class="venues" id="venues"></div>

function faceFor(a){ if(a==null)return FACES.neutral; if(a<=50)return FACES.happy; if(a<=100)return FACES.neutral; if(a<=150)return FACES.sad; return FACES.masked; }

function colorFor(a){
  if(a<=50)return "#27c093"; if(a<=100)return "#f0b429"; if(a<=150)return "#e67e22";
  if(a<=200)return "#e74c3c"; if(a<=300)return "#9b59b6"; return "#7d1128";
}
function catShort(a){
  if(a==null)return ""; if(a<=50)return "Good"; if(a<=100)return "Moderate";
  if(a<=150)return "Sensitive"; if(a<=200)return "Unhealthy";
  if(a<=300)return "Very Unhealthy"; return "Hazardous";
}
function darken(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*f); g=Math.round(g*f); b=Math.round(b*f);
  return "rgb("+r+","+g+","+b+")";
}

const DEMO = { ok:true, venues:[
  {label:"Sport Complex",aqi:173},
  {label:"Zurich Field",aqi:134},
  {label:"ES Lobby",aqi:186}
]};

function render(d){
  document.getElementById("errBox").innerHTML="";
  const box=document.getElementById("venues");
  box.innerHTML="";
  const vs=(d.venues||[]);
  box.style.setProperty("--cols", Math.min(vs.length||1, getComputedStyle(document.documentElement).getPropertyValue("--cols").trim()||3));
  vs.forEach(v=>{
    const c=colorFor(v.aqi);
    const el=document.createElement("div");
    el.className="card";
    el.style.background="linear-gradient(150deg,"+c+","+darken(c,.72)+")";
    el.innerHTML=
      '<div class="name">'+v.label+'</div>'+
      '<img class="face" alt="" src="'+faceFor(v.aqi)+'">'+
      '<div class="val">'+v.aqi+'</div>'+
      '<div class="cat">'+catShort(v.aqi)+'</div>';
    box.appendChild(el);
  });
}

function load(){
  if(!CONFIG.endpoint){render(DEMO);return;}
  const cb="__iskl_sig_"+Date.now();
  const sep=CONFIG.endpoint.includes("?")?"&":"?";
  const s=document.createElement("script");
  const timer=setTimeout(()=>{fail();cleanup();},15000);
  window[cb]=(d)=>{clearTimeout(timer);cleanup(); if(d&&d.ok){render(d);} else fail(d&&d.error);};
  function cleanup(){delete window[cb];s.remove();}
  s.onerror=()=>{clearTimeout(timer);cleanup();fail();};
  s.src=CONFIG.endpoint+sep+"callback="+cb;
  document.body.appendChild(s);
}
function fail(msg){
  document.getElementById("errBox").innerHTML='<div class="err">'+(msg?("Endpoint: "+msg):"Data unavailable")+' — sample</div>';
  render(DEMO);
}

load(); setInterval(load,CONFIG.refreshMs);
</script>
