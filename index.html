<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISKL Campus Air Quality</title>
<style>
:root{
  --navy:#1C4E8F; --navy-dark:#1B3A6B; --navy-deep:#12294c;
  --gold:#F5C400; --gold-muted:#C9A84C; --mut:#8ea0bd;
  --good:#2ecc71; --mod:#f1c40f; --usg:#e67e22; --unh:#e74c3c; --vunh:#9b59b6; --haz:#7d1128;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#eaf0fb;background:#0a1a33;
  background-image:
    radial-gradient(1400px 800px at 12% -12%,rgba(245,196,0,.10),transparent 60%),
    radial-gradient(1200px 900px at 112% 8%,rgba(28,78,143,.55),transparent 55%),
    linear-gradient(160deg,var(--navy-deep),#0a1a33 72%);
  display:flex;flex-direction:column;
  padding:3.2vh 3vw;
}
.side{position:fixed;top:0;bottom:0;width:min(320px,22vw);z-index:0;pointer-events:none;opacity:.5;
  background-repeat:repeat-y;background-size:100% auto;background-position:center top}
.side.l{left:0;transform:translateX(-52%)}
.side.r{right:0;transform:translateX(52%) scaleX(-1)}

/* header */
header{display:flex;align-items:center;gap:2vw;z-index:1;flex:none}
.crest{width:8.5vh;height:8.5vh;border-radius:50%;background:#fff;padding:.5vh;object-fit:contain;
  border:2px solid rgba(245,196,0,.5);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.htxt h1{font-size:3.3vh;font-weight:800;letter-spacing:.3px}
.htxt h1 span{color:var(--gold)}
.htxt p{font-size:1.9vh;color:var(--mut);margin-top:.3vh}
.hclock{margin-left:auto;text-align:right;z-index:1}
.hclock .t{font-size:3.6vh;font-weight:800;letter-spacing:.5px}
.hclock .d{font-size:1.8vh;color:var(--mut);margin-top:.2vh}
.hrule{height:.5vh;background:var(--gold);width:16vw;border-radius:3px;margin:1.6vh 0 0;z-index:1;flex:none}

/* venue row */
.venues{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2.4vw;z-index:1;margin:2.4vh 0}
.card{position:relative;border-radius:2.4vh;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px -24px rgba(0,0,0,.6)}
.card .bar{position:absolute;left:0;right:0;top:0;height:1.1vh}
.card .name{font-size:3.4vh;font-weight:800;margin-top:1vh;letter-spacing:.3px}
.card .val{font-size:16vh;font-weight:800;line-height:.95;letter-spacing:-2px}
.card .cat{font-size:2.4vh;font-weight:700;padding:.7vh 2vh;border-radius:999px;color:#0d1b2f;margin-top:.4vh}
.card .face{width:12vh;height:12vh;margin-top:1.4vh;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.card .time{font-size:1.7vh;color:var(--mut);margin-top:1vh}

/* footer status strip */
.foot{flex:none;z-index:1;display:flex;align-items:center;gap:2vw;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:2vh;padding:1.8vh 2.4vw}
.foot .avg{display:flex;align-items:baseline;gap:1vw;flex:none}
.foot .avg .n{font-size:6vh;font-weight:800;line-height:1}
.foot .avg .l{font-size:1.9vh;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px}
.foot .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.15)}
.foot .guide{font-size:2.1vh;line-height:1.4}
.foot .guide b{color:var(--gold)}
.foot .catbig{font-size:2.4vh;font-weight:800}
.err{position:fixed;top:1vh;left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(231,76,60,.16);border:1px solid rgba(231,76,60,.4);color:#ffd9d3;
  padding:.8vh 1.6vw;border-radius:1vh;font-size:1.7vh}
</style>
</head>
<body>
<div class="side l" id="sideL"></div>
<div class="side r" id="sideR"></div>
<div id="errBox"></div>

<header>
  <img class="crest" id="crest" alt="ISKL">
  <div class="htxt">
    <h1>Campus Air Quality <span>· Halo Sensors</span></h1>
    <p>The International School of Kuala Lumpur (ISKL)</p>
  </div>
  <div class="hclock">
    <div class="t" id="clock">--:--</div>
    <div class="d" id="cdate">—</div>
  </div>
</header>
<div class="hrule"></div>

<div class="venues" id="venues"></div>

<div class="foot">
  <div class="avg"><span class="n" id="avgNum">—</span><span class="l">Campus<br>Avg AQI</span></div>
  <div class="sep"></div>
  <div>
    <div class="catbig" id="catBig">—</div>
    <div class="guide" id="guide"></div>
  </div>
</div>

const CAT_COLORS = {
  "Good":"#2ecc71","Moderate":"#f1c40f","Unhealthy for Sensitive Groups":"#e67e22",
  "Unhealthy":"#e74c3c","Very Unhealthy":"#9b59b6","Hazardous":"#7d1128","Hazardous / Severe":"#7d1128"
};
function colorFor(a){
  if(a<=50)return "#2ecc71"; if(a<=100)return "#f1c40f"; if(a<=150)return "#e67e22";
  if(a<=200)return "#e74c3c"; if(a<=300)return "#9b59b6"; return "#7d1128";
}
function catShort(a){
  if(a==null)return ""; if(a<=50)return "Good"; if(a<=100)return "Moderate";
  if(a<=150)return "Sensitive Groups"; if(a<=200)return "Unhealthy";
  if(a<=300)return "Very Unhealthy"; return "Hazardous";
}
function faceFor(a){
  if(a==null)return ASSETS.faces.neutral;
  if(a<=50)return ASSETS.faces.happy; if(a<=100)return ASSETS.faces.neutral;
  if(a<=150)return ASSETS.faces.sad; return ASSETS.faces.masked;
}

const DEMO = {
  ok:true, generatedAt:"Wed 10 Sep, 8:00 am",
  venues:[
    {label:"Sport Complex",aqi:173,time:"7:58 am"},
    {label:"Zurich Field",aqi:134,time:"7:58 am"},
    {label:"ES Lobby",aqi:186,time:"7:58 am"}
  ],
  average:164, category:"Unhealthy",
  school:"PE, recess and after school activities held indoors. N95/P1 or equivalent masks are recommended. Lunch will be eaten indoors."
};

function render(d){
  document.getElementById("errBox").innerHTML="";
  const box=document.getElementById("venues");
  box.innerHTML="";
  (d.venues||[]).forEach(v=>{
    const c=colorFor(v.aqi);
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=
      '<div class="bar" style="background:'+c+'"></div>'+
      '<div class="name">'+v.label+'</div>'+
      '<div class="val" style="color:'+c+'">'+v.aqi+'</div>'+
      '<div class="cat" style="background:'+c+'">'+catShort(v.aqi)+'</div>'+
      '<img class="face" alt="" src="'+faceFor(v.aqi)+'">'+
      '<div class="time">'+(v.time||"")+'</div>';
    box.appendChild(el);
  });

  document.getElementById("avgNum").textContent=(d.average!=null?d.average:"—");
  document.getElementById("avgNum").style.color=(d.average!=null?colorFor(d.average):"#8ea0bd");
  document.getElementById("catBig").textContent=d.category||catShort(d.average);
  document.getElementById("catBig").style.color=(d.average!=null?colorFor(d.average):"#eaf0fb");
  document.getElementById("guide").innerHTML=(d.school?("<b>School Response:</b> "+d.school):"");
}

function tickClock(){
  const now=new Date();
  let h=now.getHours(), m=now.getMinutes();
  const ap=h<12?"AM":"PM"; h=h%12||12; m=(m<10?"0":"")+m;
  document.getElementById("clock").textContent=h+":"+m+" "+ap;
  document.getElementById("cdate").textContent=now.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
}

function load(){
  if(!CONFIG.endpoint){render(DEMO);return;}
  const cb="__iskl_sig_"+Date.now();
  const sep=CONFIG.endpoint.includes("?")?"&":"?";
  const s=document.createElement("script");
  const timer=setTimeout(()=>{fail();cleanup();},15000);
  window[cb]=(d)=>{clearTimeout(timer);cleanup(); if(d&&d.ok){render(d);} else fail(d&&d.error);};
  function cleanup(){delete window[cb];s.remove();}
  s.onerror=()=>{clearTimeout(timer);cleanup();fail();};
  s.src=CONFIG.endpoint+sep+"callback="+cb;
  document.body.appendChild(s);
}
function fail(msg){
  document.getElementById("errBox").innerHTML='<div class="err">'+(msg?("Endpoint: "+msg):"Data unavailable")+' — showing sample</div>';
  render(DEMO);
}

// prime assets
document.getElementById("crest").src=ASSETS.logo;
document.getElementById("sideL").style.backgroundImage="url('"+ASSETS.batik+"')";
document.getElementById("sideR").style.backgroundImage="url('"+ASSETS.batik+"')";

tickClock(); setInterval(tickClock,15000);
load(); setInterval(load,CONFIG.refreshMs);
</script>
