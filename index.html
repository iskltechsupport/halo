<title>ISKL Campus Sensors</title>
<script>document.documentElement.setAttribute("data-theme",(function(){var x=new Date().getHours();return (x>=19||x<7)?"dark":"light";})());</script>
<style>
:root{
  /* ---- adjust these when placing on signage ---- */
  --scale:1;        /* overall size multiplier (0.8 smaller, 1.3 bigger) */
  --aspect:2.6;     /* card width / height ratio (higher = flatter cards) */
  --gap:1.6vw;      /* space between the cards */
  --pad:2vh 2vw;    /* outer padding; set to 0 to bleed to the edges */

  --gold:#F5C400;
  /* card theme (light = day, dark = night) */
  --text:#14294a; --mut:#5f6f88;
  --surface-grad:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,255,255,.82));
  --line:rgba(20,41,74,.12);
  --shadow:0 1.6vh 4vh -2vh rgba(20,41,74,.4);
}
html[data-theme="dark"]{
  --text:#eaf0fb; --mut:#9fb0cc;
  --surface-grad:linear-gradient(160deg,rgba(26,45,74,.92),rgba(18,32,58,.82));
  --line:rgba(255,255,255,.14);
  --shadow:0 1.6vh 4vh -1.6vh rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);padding:var(--pad);overflow:hidden}

.venues{height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:var(--gap)}

.card{
  flex:1 1 0;min-width:0;aspect-ratio:var(--aspect);max-height:98%;
  container-type:size;position:relative;overflow:hidden;
  border-radius:calc(7cqmin * var(--scale));
  background:var(--surface-grad);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;text-align:left;
  padding:calc(6cqmin * var(--scale)) calc(7cqmin * var(--scale));
  padding-left:calc(9cqmin * var(--scale));
}
.card .strip{position:absolute;left:0;top:0;bottom:0;width:calc(3cqmin * var(--scale))}
.card .face{position:absolute;top:calc(7cqmin * var(--scale));right:calc(7cqmin * var(--scale));
  width:calc(30cqmin * var(--scale));height:calc(30cqmin * var(--scale));
  filter:drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.3))}
.card .name{font-size:calc(12cqmin * var(--scale));font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mut)}
.card .val{font-size:calc(48cqmin * var(--scale));font-weight:800;line-height:.95;letter-spacing:-.03em;
  margin:calc(1.5cqmin * var(--scale)) 0}
.card .sub{font-size:calc(11cqmin * var(--scale));color:var(--mut);font-weight:600}

.err{position:fixed;top:1vh;left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(231,76,60,.16);border:1px solid rgba(231,76,60,.4);color:#ffd9d3;
  padding:.7vh 1.4vw;border-radius:1vh;font-size:1.7vh}
</style>
</head>

function colorFor(a){
  if(a<=50)return "#2ecc71"; if(a<=100)return "#f1c40f"; if(a<=150)return "#e67e22";
  if(a<=200)return "#e74c3c"; if(a<=300)return "#9b59b6"; return "#7d1128";
}
function catShort(a){
  if(a==null)return ""; if(a<=50)return "Good"; if(a<=100)return "Moderate";
  if(a<=150)return "Sensitive Groups"; if(a<=200)return "Unhealthy";
  if(a<=300)return "Very Unhealthy"; return "Hazardous";
}
function faceFor(a){
  if(a==null)return FACES.neutral;
  if(a<=50)return FACES.happy; if(a<=100)return FACES.neutral;
  if(a<=150)return FACES.sad; return FACES.masked;
}

const DEMO = { ok:true, venues:[
  {label:"Sport Complex",aqi:173,time:"7:58 am"},
  {label:"Zurich Field",aqi:134,time:"7:58 am"},
  {label:"ES Lobby",aqi:186,time:"7:58 am"}
]};

function render(d){
  document.getElementById("errBox").innerHTML="";
  const box=document.getElementById("venues");
  box.innerHTML="";
  (d.venues||[]).forEach(v=>{
    const c=colorFor(v.aqi);
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=
      '<div class="strip" style="background:'+c+'"></div>'+
      '<img class="face" alt="" src="'+faceFor(v.aqi)+'">'+
      '<div class="name">'+v.label+'</div>'+
      '<div class="val" style="color:'+c+'">'+v.aqi+'</div>'+
      '<div class="sub">'+catShort(v.aqi)+(v.time?' · '+v.time:'')+'</div>';
    box.appendChild(el);
  });
}

function load(){
  if(!CONFIG.endpoint){render(DEMO);return;}
  const cb="__iskl_sig_"+Date.now();
  const sep=CONFIG.endpoint.includes("?")?"&":"?";
  const s=document.createElement("script");
  const timer=setTimeout(()=>{fail();cleanup();},15000);
  window[cb]=(d)=>{clearTimeout(timer);cleanup(); if(d&&d.ok){render(d);} else fail(d&&d.error);};
  function cleanup(){delete window[cb];s.remove();}
  s.onerror=()=>{clearTimeout(timer);cleanup();fail();};
  s.src=CONFIG.endpoint+sep+"callback="+cb;
  document.body.appendChild(s);
}
function fail(msg){
  document.getElementById("errBox").innerHTML='<div class="err">'+(msg?("Endpoint: "+msg):"Data unavailable")+' — sample</div>';
  render(DEMO);
}

function autoTheme(){var x=new Date().getHours();document.documentElement.setAttribute("data-theme",(x>=19||x<7)?"dark":"light");}
autoTheme(); setInterval(autoTheme,60000);
load(); setInterval(load,CONFIG.refreshMs);
</script>
